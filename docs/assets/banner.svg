<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="RaveBot: DJ booking on autopilot for Discord">
  <defs>
    <radialGradient id="sky" cx="18%" cy="0%" r="110%">
      <stop offset="0" stop-color="#2a2f7a"/><stop offset=".55" stop-color="#0d1030"/><stop offset="1" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="planet" cx="32%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffd89b"/><stop offset=".45" stop-color="#c2693a"/><stop offset="1" stop-color="#4a1d5c"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9a8ff"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#2ad4ff"/></linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="90" cy="60" r="1.6" opacity=".9"/><circle cx="210" cy="250" r="1.2" opacity=".7"/><circle cx="330" cy="40" r="1.4" opacity=".8"/>
    <circle cx="470" cy="280" r="1.6" opacity=".6"/><circle cx="560" cy="70" r="1.2" opacity=".8"/><circle cx="700" cy="30" r="1.5" opacity=".7"/>
    <circle cx="790" cy="290" r="1.3" opacity=".8"/><circle cx="880" cy="95" r="1.1" opacity=".6"/><circle cx="1010" cy="40" r="1.7" opacity=".9"/>
    <circle cx="1100" cy="270" r="1.2" opacity=".7"/><circle cx="1210" cy="150" r="1.5" opacity=".8"/><circle cx="40" cy="170" r="1.2" opacity=".6"/>
    <circle cx="640" cy="200" r="1" opacity=".5"/><circle cx="950" cy="210" r="1" opacity=".5"/><circle cx="150" cy="130" r="1" opacity=".5"/>
  </g>
  <defs>
    <clipPath id="front"><rect x="-200" y="0" width="400" height="80"/></clipPath>
  </defs>
  <g transform="translate(1030 160) rotate(-18)">
    <ellipse cx="0" cy="0" rx="150" ry="34" fill="none" stroke="#b9a8ff" stroke-opacity=".35" stroke-width="6"/>
    <circle cx="0" cy="0" r="78" fill="url(#planet)"/>
    <ellipse cx="0" cy="0" rx="150" ry="34" fill="none" stroke="#e6dcff" stroke-opacity=".85" stroke-width="6" clip-path="url(#front)"/>
  </g>
  <g transform="translate(124 292)" fill="url(#bar)">
    <rect x="0" y="-26" width="12" height="26" rx="3"/><rect x="20" y="-52" width="12" height="52" rx="3"/><rect x="40" y="-36" width="12" height="36" rx="3"/>
    <rect x="60" y="-66" width="12" height="66" rx="3"/><rect x="80" y="-44" width="12" height="44" rx="3"/><rect x="100" y="-58" width="12" height="58" rx="3"/>
    <rect x="120" y="-30" width="12" height="30" rx="3"/>
  </g>
  <text x="120" y="135" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="800" fill="url(#title)" letter-spacing="1">RaveBot</text>
  <text x="124" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#cfd3ff" opacity=".92">DJ booking on autopilot for your Discord rave</text>
